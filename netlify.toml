[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set SITE_URL in Netlify UI once the real domain is live; it drives
  # canonicals, sitemap.xml and robots.txt.
  SITE_URL = "https://bsdgaragedoorllc.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
